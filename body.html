<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUKA ID App</title>
<style>
body{margin:0;font-family:sans-serif;}
.screen{display:none;padding:20px;}
.screen.active{display:block;}
.tabs{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ccc;}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;}
.tab.active{background:#1A5C38;color:#fff;}
</style>
</head>
<body><div id="home" class="screen active">Home Screen</div>
<div id="chat" class="screen">Chat Screen</div>
<div id="pricing" class="screen">Pricing Screen</div>
<div id="booking" class="screen">Booking Screen</div>
<div id="feedback" class="screen">Feedback Screen</div><div class="tabs">
  <div class="tab active" data-target="home">Home</div>
  <div class="tab" data-target="chat">Chat</div>
  <div class="tab" data-target="pricing">Pricing</div>
  <div class="tab" data-target="booking">Booking</div>
  <div class="tab" data-target="feedback">Feedback</div>
</div><script>
const tabs = document.querySelectorAll('.tab');
const screens = document.querySelectorAll('.screen');

function switchScreen(target) {
  tabs.forEach(t => t.classList.remove('active'));
  screens.forEach(s => s.classList.remove('active'));

  document.querySelector(`.tab[data-target="${target}"]`).classList.add('active');
  document.getElementById(target).classList.add('active');
}

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    switchScreen(tab.dataset.target);
  });

  tab.addEventListener('touchstart', () => {
    switchScreen(tab.dataset.target);
  });
});
</script></body>
</html>
